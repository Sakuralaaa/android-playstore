# DroidCloud + Redroid 组合编排（无需 /dev/kvm，支持 x86_64 与甲骨文 ARM64）
# 使用前提：宿主机内核已加载 binder_linux 模块（Ubuntu ARM/x86 可执行:
#   apt install -y linux-modules-extra-$(uname -r) && modprobe binder_linux devices="binder,hwbinder,vndbinder"）
#
# 启动命令：
#   ACCESS_PASSWORD=你的密码 docker compose -f docker-compose.redroid.yml up -d
#
# 可选 REDROID_IMAGE 示例：
#   - redroid/redroid:14.0.0-latest        (官方 Android 14)
#   - redroid/redroid:13.0.0-latest        (官方 Android 13)
#   - redroid/redroid:12.0.0-latest        (官方 Android 12)
#   - redroid/redroid:11.0.0-latest        (官方 Android 11)
#   - redroid/redroid:9.0.0-latest         (官方 Android 9)
#   - teddysun/redroid:11.0.0-gapps        (社区 Android 11 + GApps)
#   - teddysun/redroid:13.0.0-gapps        (社区 Android 13 + GApps)

services:
  redroid:
    image: "${REDROID_IMAGE:-redroid/redroid:11.0.0-latest}"
    container_name: droidcloud-redroid
    privileged: true
    volumes:
      - redroid-data:/data
    command:
      - androidboot.redroid_gpu_mode=guest
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1600
      - androidboot.redroid_dpi=320
      - androidboot.redroid_fps=30
      - androidboot.use_memfd=true
    restart: unless-stopped

  droidcloud:
    image: ghcr.io/sakuralaaa/android-playstore:latest
    build: .
    container_name: droidcloud-controller
    depends_on:
      - redroid
    environment:
      ACCESS_PASSWORD: "${ACCESS_PASSWORD:-change-me-please}"
      # 自动在控制台里注册 Redroid 实例（格式: 名称=host:port，可用逗号分隔多台）
      REDROID_TARGETS: "${REDROID_TARGETS:-Redroid 云手机=redroid:5555}"
      AUTO_START_PHONE: "${AUTO_START_PHONE:-first}"
    ports:
      - "${PORT:-6080}:6080"
    volumes:
      - droidcloud-meta:/root/.android
      - ./apks:/apks
    restart: unless-stopped

volumes:
  redroid-data:
  droidcloud-meta:
