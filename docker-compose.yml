services:
  droidcloud:
    image: ghcr.io/sakuralaaa/android-playstore:latest
    build: .
    container_name: droidcloud
    devices:
      - /dev/kvm:/dev/kvm
    environment:
      # Web 控制台登录密码（兼容旧 VNC_PASSWORD；若留空则自动生成并打印在容器日志里）
      ACCESS_PASSWORD: "${ACCESS_PASSWORD:-change-me-please}"
      # 可选：固定外部自动化 / AI Agent 调用的 API Token（留空则自动生成并可在网页「开放 API」查看）
      # API_TOKEN: "dc_your_custom_token_here"
      # 以下为新建云手机时的默认参数，每台云手机都可在网页中独立配置版本、型号、语言、代理与自动关机
      ANDROID_VERSION: "${ANDROID_VERSION:-16}"
      DEVICE: "${DEVICE:-pixel_8}"
      RAM_MB: "${RAM_MB:-3072}"
      CORES: "${CORES:-3}"
      DATA_SIZE: "${DATA_SIZE:-16G}"
      SCREEN_PRESET: "${SCREEN_PRESET:-balanced}"      # smooth | balanced | hd
      STREAM_PRESET: "${STREAM_PRESET:-balanced}"      # smooth | balanced | ultra
      DNS_SERVERS: "${DNS_SERVERS:-8.8.8.8}"
      # 默认留空：容器启动后所有手机处于关机待命（几乎零 CPU/内存占用），按需开机
      # 如需容器启动时自动打开第一台手机，可设为 first
      AUTO_START_PHONE: "${AUTO_START_PHONE:-}"
    ports:
      - "${PORT:-6080}:6080"
    volumes:
      - android-sdk:/opt/android-sdk
      - android-avd:/root/.android
      - ./apks:/apks
    shm_size: "2g"
    restart: unless-stopped

volumes:
  android-sdk:
  android-avd:
